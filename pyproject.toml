[project]
name = "adaptive-agentops"
version = "0.1.0"
description = "Secure AI Agent Control Plane"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.14.1,<3",
]

[project.optional-dependencies]
dev = [
    # Temporary pin: monkeypatch teardown regression (https://github.com/pytest-dev/pytest/issues/15099).
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["adaptive_agentops*"]
