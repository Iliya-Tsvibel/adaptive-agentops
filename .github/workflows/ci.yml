name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # The full Bookworm image includes Git for the Stage 3 evaluator tests.
      TEST_IMAGE: python:3.12.16-bookworm@sha256:4209fae09a3e20afd863e528bfddc235da5fd5977983e1996cd54cc9a72e6267
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download pinned test wheels
        run: |
          mkdir -p "$RUNNER_TEMP/wheels"
          python3 -I - "$GITHUB_WORKSPACE/.github/ci-requirements.txt" > "$RUNNER_TEMP/ci-requirements.txt" <<'PYTHON'
          import re
          import sys
          from pathlib import Path

          approved = set(b"""
              annotated-doc annotated-types anyio certifi click fastapi h11 httpcore httpx
              idna iniconfig opentelemetry-api packaging pluggy pydantic pydantic-core pygments
              pytest setuptools starlette typing-extensions typing-inspection uvicorn
          """.split())
          pin = re.compile(rb"([a-z0-9]+(?:-[a-z0-9]+)*)==[0-9]+(?:\.[0-9]+)+ --hash=sha256:[0-9a-f]{64}")

          lines = Path(sys.argv[1]).read_bytes().splitlines()
          for number, line in enumerate(lines, 1):
              match = pin.fullmatch(line)
              if not match or match[1] not in approved:
                  sys.exit(f"Invalid, unapproved, or duplicate CI wheel pin on line {number}")
              approved.remove(match[1])
          if approved:
              sys.exit("Missing approved CI wheel pins: " + b", ".join(sorted(approved)).decode("ascii"))

          sys.stdout.buffer.write(b"\n".join(lines) + b"\n")
          PYTHON
          docker run --rm --user "$(id -u):$(id -g)" \
            --cap-drop ALL --security-opt no-new-privileges --env PIP_CONFIG_FILE=/dev/null \
            --mount "type=bind,src=$RUNNER_TEMP/ci-requirements.txt,dst=/requirements.txt,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/wheels,dst=/wheels" \
            "$TEST_IMAGE" python -m pip --isolated --disable-pip-version-check --no-cache-dir \
              download --index-url https://pypi.org/simple --only-binary=:all: --require-hashes \
              --dest /wheels -r /requirements.txt

      - name: Install and run pytest offline
        run: |
          docker run --rm --pull never --network none --user "$(id -u):$(id -g)" \
            --cap-drop ALL --security-opt no-new-privileges \
            --env HOME=/tmp --env PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/checkout,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/wheels,dst=/wheels,readonly" \
            "$TEST_IMAGE" sh -ec '
              cp -R /checkout /tmp/source
              cd /tmp/source
              git rev-parse HEAD
              python -m venv /tmp/test-venv
              export PATH="/tmp/test-venv/bin:$PATH"
              python -m pip --disable-pip-version-check install --no-index --find-links=/wheels ".[dev]"
              # Run sequentially so the owned loopback tests can bind port 8001.
              python -m pytest -q --tb=short
            '

      - name: Summarize failure
        if: failure()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ### Offline Python CI failed

          - For checkout or wheel download failures, inspect the first failed step for Git, Docker pull, or PyPI errors.
          - For offline install failures, check that `.github/ci-requirements.txt` covers `pyproject.toml` and its build dependencies.
          - For test failures, expand **Install and run pytest offline** for failed test IDs and tracebacks. Reproduce with `python -m pytest -q --tb=short <test-id>` from a Python 3.12 Git checkout.
          SUMMARY
